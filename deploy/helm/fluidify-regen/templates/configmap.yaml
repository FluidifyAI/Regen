apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fluidify-regen.fullname" . }}
  labels:
    {{- include "fluidify-regen.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  PORT: {{ .Values.config.port | quote }}
  {{- if .Values.config.corsAllowedOrigins }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  {{- end }}
  {{- if .Values.config.samlBaseURL }}
  SAML_BASE_URL: {{ .Values.config.samlBaseURL | quote }}
  {{- end }}
  SAML_ALLOW_IDP_INITIATED: {{ .Values.config.samlAllowIdpInitiated | quote }}
  TEAMS_SERVICE_URL: {{ .Values.config.teamsServiceURL | quote }}
  {{- if .Values.config.slackAutoInviteUserIDs }}
  SLACK_AUTO_INVITE_USER_IDS: {{ .Values.config.slackAutoInviteUserIDs | quote }}
  {{- end }}
  {{- if .Values.tracing.otlpExporterEndpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.tracing.otlpExporterEndpoint | quote }}
  {{- end }}
  {{- if .Values.tracing.tracesSampler }}
  OTEL_TRACES_SAMPLER: {{ .Values.tracing.tracesSampler | quote }}
  {{- end }}
  {{- if .Values.tracing.tracesSamplerArg }}
  OTEL_TRACES_SAMPLER_ARG: {{ .Values.tracing.tracesSamplerArg | quote }}
  {{- end }}
